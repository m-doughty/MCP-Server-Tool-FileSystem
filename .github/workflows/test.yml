name: test

# NB: the dependency install step pulls MCP::Server from the ecosystem, so CI
# tests against the RELEASED server, not a sibling checkout. If tests here rely
# on unreleased MCP::Server work, CI stays red until that release lands — the
# fix is to release MCP::Server and raise the version pin in META6.json, not
# to change anything here.

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  raku:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        raku-version:
          - 'latest'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: Raku/setup-raku@v1
        with:
          raku-version: ${{ matrix.raku-version }}
      - name: Install Dependencies
        run: zef install --/test --test-depends --deps-only .
      - name: Install App::Prove6
        run: zef install --/test App::Prove6
      - name: Run Tests
        run: prove6 -I. t
